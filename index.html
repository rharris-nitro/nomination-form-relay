<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nomination form submission</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  #status { padding: 16px; border-radius: 8px; margin-top: 20px; }
  .pending { background: #eef2f7; color: #333; }
  .success { background: #e6f4ea; color: #1e4620; }
  .error { background: #fdeaea; color: #611a15; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; background: #f5f5f5; padding: 10px; border-radius: 6px; }
</style>
</head>
<body>
  <h1>Submitting your nomination form&hellip;</h1>
  <div id="status" class="pending">Reading form data from the link&hellip;</div>

<script>
// This page exists purely to route around a legacy PDF viewer's inability
// to POST directly to a modern HTTPS endpoint. It is opened via app.launchURL()
// from a button inside the nomination PDF, with the form's field values
// attached as query-string parameters. This page reads those parameters,
// builds a JSON body, and POSTs it (via fetch, in a real browser, with no
// legacy networking stack involved) to the Power Automate trigger URL.

// TODO: replace with your actual Power Automate "Anyone" trigger URL
const TRIGGER_URL = "https://defaulte56492bb794a4d6ea0350aced11c54.d6.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/bc538d1995c54c0c9dc847421a3aa1bf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=1pSVj-z52OnoC2QLxi0Ti2OgwjLtYrzuojzIE6dpoQ4";

const FIELDS = [
  "ward_division", "date_of_election", "council_area",
  "candidate_surname", "candidate_title", "candidate_forenames",
  "commonly_used_name", "date_of_birth", "candidate_email",
  "description", "home_address", "proposer_name", "seconder_name",
  "date_of_consent", "witness_name", "witness_email"
];

const statusEl = document.getElementById("status");

function setStatus(cls, html) {
  statusEl.className = cls;
  statusEl.innerHTML = html;
}

const params = new URLSearchParams(window.location.search);
const payload = {};
FIELDS.forEach(f => { payload[f] = params.get(f) || ""; });

const missing = FIELDS.filter(f => !payload[f]);
if (missing.length === FIELDS.length) {
  setStatus("error", "No form data was found in the link. This page should be opened via the Submit button in the nomination PDF, not visited directly.");
} else {
  setStatus("pending", "Sending your nomination data to the processing flow&hellip;");

  fetch(TRIGGER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(async (res) => {
    const text = await res.text();
    if (res.ok) {
      setStatus("success", "<strong>Submitted successfully.</strong> Your nomination form has been sent for processing. You may close this window.");
    } else {
      setStatus("error", "<strong>Submission failed.</strong> Status " + res.status + "<pre>" + text.replace(/</g, "&lt;") + "</pre>");
    }
  })
  .catch((err) => {
    // A network-level failure here (as opposed to a non-2xx response above)
    // most likely means a CORS block, since fetch() cannot distinguish
    // CORS failures from other network errors in the error object.
    setStatus("error", "<strong>Request could not be completed.</strong> This is most likely a CORS restriction on the Power Automate endpoint blocking browser-based requests from this page's origin.<pre>" + err + "</pre>");
  });
}
</script>
</body>
</html>
